<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ShopDock · 多店工作台</title>
  <meta name="description" content="本地部署的商品、订单与视频发布工作台">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="auth" class="auth-screen" hidden></div>
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#overview"><img src="/assets/logo.svg" alt=""><span>ShopDock<small>多店工作台</small></span><span class="brand-dot"></span></a>
      <div class="workspace"><span class="workspace-logo">店</span><span>我的本地空间<small>私有部署 · 数据由你掌握</small></span></div>
      <div class="nav-label">工作空间</div>
      <nav id="nav" aria-label="主要导航"></nav>
      <div class="sidebar-bottom"><div class="local-indicator"><span></span> 本地服务运行中</div><small>ShopDock Community · v0.3.0</small><button class="text-button" id="logout">退出登录 <span>↗</span></button></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">工作概览</strong></div><div class="topbar-right"><span class="local-pill">LOCAL</span><span id="clock"></span><span class="avatar">我</span></div></header>
      <main id="main" tabindex="-1"></main>
      <footer>你的商品，你的渠道，你的工作节奏。<span>在同一个地方，有序经营。</span></footer>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
